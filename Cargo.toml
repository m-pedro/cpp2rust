[package]
name = "cpp2rust"
version = "0.2.0"
edition = "2021"
description = "Zero-copy HTTP access log parser and Rayon parallel aggregator migrated from C11/C++17"

[lib]
name = "cpp2rust"
path = "src/lib.rs"

[[bin]]
name = "logengine_rs"
path = "src/main.rs"

[dependencies]
memmap2 = "0.9"
rayon = "1.10"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "engine_bench"
harness = false
